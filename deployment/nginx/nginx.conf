# Reverse proxy in front of the frontend and backend containers.
# TLS termination is left to your host (managed load balancer, certbot,
# Cloudflare, ...) rather than guessed here — add a `listen 443 ssl`
# server block with your certificate paths once you know what that is.

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Matches BOOKING_ATTACHMENT_MAX_SIZE_MB (backend/config/settings/base.py,
    # default 25) — the largest request body this deployment needs to
    # accept is a booking attachment upload. Keep these two in sync;
    # nginx rejects oversized bodies before Django gets a chance to
    # return its own validation error if this drifts below that value.
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    location /media/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}